version: "2"

linters:
  enable:
    - staticcheck
    - errcheck
    - govet
    - revive
    - gocritic
    - gosec
    - ineffassign
    - misspell
    - bodyclose
    - noctx
    - goimports
  disable:
    - exhaustive

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - whyNoLint
  goimports:
    local-prefixes: github.com/simonwistow/apivalidator
  gosec:
    excludes:
      - G304  # file path from variable — intentional in schema loading methods

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck
